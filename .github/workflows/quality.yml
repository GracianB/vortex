name: Vórtice Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vortex-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static + unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - name: Full dependency audit
        run: npm audit --audit-level=high

  browser:
    name: Browser E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload Vórtice E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-e2e-${{ github.sha }}
          path: artifacts/e2e
          if-no-files-found: warn
          retention-days: 7
